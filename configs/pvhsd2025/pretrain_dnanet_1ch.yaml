name: pvhsd-dnanet-1ch-pretrain
task:
  factory: solar_ir.pretraining:create_task
  dataset_root: data/processed/pv_hsd2025/grayscale_box_masks_v1
  supervision: bbox_raster_weak_mask
  image_size:
  - 640
  - 512
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    scale_min: 0.5
    scale_max: 2.0
    gaussian_blur_prob: 0.5
  model:
    factory: solar_ir.models.dnanet:create_model
    input_channels: 1
    num_classes: 1
    backbone: resnet_18
    channel_size: three
    deep_supervision: true
training:
  seed: 7
  loss: soft_iou
  optimizer: Adagrad
  scheduler: upstream_once
  min_lr: 1.0e-05
  drop_last: true
  batch_size: 4
  max_epochs: 1500
  patience: 1500
  learning_rate: 0.05
  gradient_clip: null
  checkpoint_every_steps: 100
  selection_metric: weak_mask_iou
  selection_mode: max
  amp: false
tracking:
  wandb:
    mode: disabled
    project: solar-ir-competition
    system_monitoring: true
    tags:
    - solar-ir
    - dnanet
    - pv-hsd-2025
    - pretrain
    - one-channel
    - weak-box-mask
artifacts:
- name: pvhsd_prepared_manifest
  path: data/processed/pv_hsd2025/grayscale_box_masks_v1/manifest.json
  version: grayscale-box-masks-v1
