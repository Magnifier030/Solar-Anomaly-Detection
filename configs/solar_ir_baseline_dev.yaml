name: solar-ir-simple-unet-development
task:
  factory: solar_ir.task:create_task
  dataset_root: data/raw/datasets/9_16_train_set
  groups_csv: data/raw/supplement/SolarDefectDataset_supplement/train_groups.csv
  supervision: polygon_mask
  split_strategy: random_stratified
  validation_fraction: 0.2
  image_size: 256
  metric_threshold: 0.5
  model:
    factory: solar_ir.models.simple_unet:create_model
    base_channels: 16
training:
  seed: 7
  batch_size: 8
  max_epochs: 150
  patience: 25
  learning_rate: 0.0001
  gradient_clip: 1.0
  checkpoint_every_steps: 100
  selection_metric: F1_TIoU
  selection_mode: max
  amp: true
tracking:
  wandb:
    mode: disabled
    project: solar-ir-competition
    system_monitoring: true
    tags: [solar-ir, thermal, segmentation, simple-unet, development]
