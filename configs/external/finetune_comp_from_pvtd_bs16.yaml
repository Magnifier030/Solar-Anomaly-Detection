name: finetune-comp-from-pvtd-bs16
task:
  factory: solar_ir.task:create_task
  dataset_root: data/raw/datasets/9_16_train_set
  groups_csv: data/raw/supplement/SolarDefectDataset_supplement/train_groups.csv
  supervision: polygon_mask
  split_strategy: group
  image_size:
  - 640
  - 512
  preprocessing: grayscale
  validation_fraction: 0.2
  metric_threshold: 0.5
  metric_aggregation: global
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    scale_min: 0.5
    scale_max: 2.0
    gaussian_blur_prob: 0.5
  model:
    factory: solar_ir.models.dnanet:create_model
    input_channels: 1
    num_classes: 1
    backbone: resnet_18
    channel_size: three
    deep_supervision: true
    pretrained_path: outputs/pretrain-pvtd-dnanet-1ch-bs16/best.pt
  validation_groups:
  - G02
  - G05
  - G08
  external_pretraining:
    dataset: PV-Thermal-Defects
    source_revision: dd88e35595f4
    supervision: bbox_raster_weak_mask
    prepared_manifest: data/processed/pv_thermal_defects/weak_box_masks_v1/manifest.json
training:
  seed: 7
  loss: soft_iou
  optimizer: Adagrad
  scheduler: upstream_once
  min_lr: 1.0e-05
  drop_last: true
  batch_size: 16
  max_epochs: 100
  patience: 100
  learning_rate: 0.005
  gradient_clip: null
  checkpoint_every_steps: 100
  selection_metric: F1_TIoU
  selection_mode: max
  amp: false
tracking:
  wandb:
    mode: disabled
    project: solar-ir-competition
    system_monitoring: true
    tags:
    - solar-ir
    - dnanet
    - pv-hsd-2025
    - finetune
    - one-channel
    - polygon-mask

artifacts:
- name: pvtd_pretrained_checkpoint
  path: outputs/pretrain-pvtd-dnanet-1ch-bs16/best.pt
  version: pretrain-pvtd-dnanet-1ch-bs16
- name: pvtd_prepared_manifest
  path: data/processed/pv_thermal_defects/weak_box_masks_v1/manifest.json
  version: yolo-box-weak-mask-v1
runtime:
  cudnn:
    enabled: true
    benchmark: true
    deterministic: false
